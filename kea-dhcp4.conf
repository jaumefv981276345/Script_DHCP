#!/bin/bash
# Script de configuració KEA DHCP – Subred Gestió Infraestructura

DHCP_CONF="/etc/kea/kea-dhcp4.conf"
INTERFACE="eth0"

# Crear archivo de configuración
sudo tee "$DHCP_CONF" > /dev/null <<EOF
{
  "Dhcp4": {
    "interfaces-config": { "interfaces": ["$INTERFACE"] },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600
    },
    "valid-lifetime": 600,
    "max-valid-lifetime": 7200,
    "subnet4": [
      {
        "id": 1,
        "subnet": "10.18.55.64/26",
        "pools": [
          { "pool": "10.18.55.80 - 10.18.55.126" }
        ],
        "option-data": [
          { "name": "routers", "data": "10.18.55.65" },
          { "name": "domain-name-servers", "data": "8.8.8.8, 8.8.4.4" },
          { "name": "domain-name", "data": "xarxaadmin.local" }
        ],
        "reservations": [
          {
            "hw-address": "BC:24:11:42:9D:9B",
            "ip-address": "10.18.55.66",
            "hostname": "S.DHCP.Gest"
          },
          {
            "hw-address": "BC:24:11:0D:C1:5F",
            "ip-address": "10.18.55.70",
            "hostname": "proba1"
          }
        ]
      }
    ]
  }
}
EOF

# Reiniciar y habilitar KEA
sudo systemctl restart kea-dhcp4-server
sudo systemctl enable kea-dhcp4-server
sudo systemctl status kea-dhcp4-server

echo "Configuración KEA DHCP completada."